name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The cutoff-selection, sign-convention, calibration and metric tests read
      # data/processed/*.parquet and self-skip when it is missing. Fail loudly
      # instead, so a silently skipped suite can never turn CI green.
      - name: Require the processed snapshot
        run: |
          test -f data/processed/forecasts.parquet
          test -f data/processed/actuals.parquet

      # test_contract.py parses frontend/src/types.ts, so it needs the full repo.
      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend lint, test and build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build
